  # ---------------------------------------------------------------------------
  # v2_license_extraction: Runs after all wheel builds; collects scan result
  # tarballs from COS (one per UBI×Python combo), extracts licenses, uploads
  # the combined license results tarball back to COS.
  # ---------------------------------------------------------------------------
  v2_license_extraction:
    needs:
      - wheel_build_ubi9_py310
      - wheel_build_ubi9_py311
      - wheel_build_ubi9_py312
      - wheel_build_ubi9_py313
      - wheel_build_ubi9_py314
      - wheel_build_ubi10_py312
      - wheel_build_ubi10_py313
      - wheel_build_ubi10_py314
    if: |
      always() &&
      (needs.wheel_build_ubi9_py310.result == 'success' ||
       needs.wheel_build_ubi9_py311.result == 'success' ||
       needs.wheel_build_ubi9_py312.result == 'success' ||
       needs.wheel_build_ubi9_py313.result == 'success' ||
       needs.wheel_build_ubi9_py314.result == 'success' ||
       needs.wheel_build_ubi10_py312.result == 'success' ||
       needs.wheel_build_ubi10_py313.result == 'success' ||
       needs.wheel_build_ubi10_py314.result == 'success')
    runs-on: ${{ inputs.large-runner-label != '' && inputs.large-runner-label || 'ubuntu-24.04-ppc64le' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Collect scan results from COS
        env:
          GHA_CURRENCY_SERVICE_ID_API_KEY: ${{ secrets.GHA_CURRENCY_SERVICE_ID_API_KEY }}
        run: |
          chmod +x ./gha-script/v2-script/collect_scan_results.sh
          bash ./gha-script/v2-script/collect_scan_results.sh \
            "${{ fromJson(inputs.package_json).package_name }}" \
            "${{ fromJson(inputs.package_json).package_version }}" \
            "$GITHUB_WORKSPACE/v2-scan-workspace" \
            "${{ github.run_id }}"

      - name: Extract wheel licenses
        run: |
          chmod +x ./gha-script/v2-script/extract_wheel_licenses.sh
          bash ./gha-script/v2-script/extract_wheel_licenses.sh \
            "$GITHUB_WORKSPACE/v2-scan-workspace" \
            "$GITHUB_WORKSPACE"

      - name: Write per-job build statuses for downstream summary
        env:
          STATUS_UBI9_PY310: ${{ needs.wheel_build_ubi9_py310.result }}
          STATUS_UBI9_PY311: ${{ needs.wheel_build_ubi9_py311.result }}
          STATUS_UBI9_PY312: ${{ needs.wheel_build_ubi9_py312.result }}
          STATUS_UBI9_PY313: ${{ needs.wheel_build_ubi9_py313.result }}
          STATUS_UBI9_PY314: ${{ needs.wheel_build_ubi9_py314.result }}
          STATUS_UBI10_PY312: ${{ needs.wheel_build_ubi10_py312.result }}
          STATUS_UBI10_PY313: ${{ needs.wheel_build_ubi10_py313.result }}
          STATUS_UBI10_PY314: ${{ needs.wheel_build_ubi10_py314.result }}
        run: |
          printf '%s\n' \
            "STATUS_UBI9_PY310=${STATUS_UBI9_PY310}" \
            "STATUS_UBI9_PY311=${STATUS_UBI9_PY311}" \
            "STATUS_UBI9_PY312=${STATUS_UBI9_PY312}" \
            "STATUS_UBI9_PY313=${STATUS_UBI9_PY313}" \
            "STATUS_UBI9_PY314=${STATUS_UBI9_PY314}" \
            "STATUS_UBI10_PY312=${STATUS_UBI10_PY312}" \
            "STATUS_UBI10_PY313=${STATUS_UBI10_PY313}" \
            "STATUS_UBI10_PY314=${STATUS_UBI10_PY314}" \
            > build-status.env

      - name: Upload build-status artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-status
          path: build-status.env

      - name: Archive and upload license results to COS
        env:
          GHA_CURRENCY_SERVICE_ID_API_KEY: ${{ secrets.GHA_CURRENCY_SERVICE_ID_API_KEY }}
          GHA_RUN_ID: ${{ github.run_id }}
          PACKAGE_NAME: ${{ fromJson(inputs.package_json).package_name }}
          PACKAGE_VERSION: ${{ fromJson(inputs.package_json).package_version }}
        run: |
          ARTIFACT_NAME="${PACKAGE_NAME}-${PACKAGE_VERSION}-v2-license-results"
          tar -czf "${ARTIFACT_NAME}.tar.gz" v2-scan-workspace/wheel
          chmod +x ./gha-script/v2-script/upload_to_cos.sh
          bash ./gha-script/v2-script/upload_to_cos.sh "${ARTIFACT_NAME}.tar.gz"

  # ---------------------------------------------------------------------------
  # cleanup_artifacts: Always runs after all wheel-build jobs (including when
  # all are skipped) to delete the shared artifacts from GHA storage.
  # ---------------------------------------------------------------------------
  cleanup_artifacts:
    needs:
      - wheel_build_ubi9_py310
      - wheel_build_ubi9_py311
      - wheel_build_ubi9_py312
      - wheel_build_ubi9_py313
      - wheel_build_ubi9_py314
      - wheel_build_ubi10_py312
      - wheel_build_ubi10_py313
      - wheel_build_ubi10_py314
    if: always()
    runs-on: ${{ inputs.large-runner-label != '' && inputs.large-runner-label || 'ubuntu-24.04-ppc64le' }}
    steps:
      - name: Delete shared GHA artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            powercore-wheels
            powercore-config
            scan-tools
            build-info

  # ---------------------------------------------------------------------------
  # v2_final_summary: Re-collects scan + license results from COS, generates
  # the final markdown/JSON summary, uploads it to COS.
  # ---------------------------------------------------------------------------
  v2_final_summary:
    needs: [v2_license_extraction]
    if: ${{ always() && (needs.v2_license_extraction.result == 'success' || needs.v2_license_extraction.result == 'failure') }}
    runs-on: ${{ inputs.large-runner-label != '' && inputs.large-runner-label || 'ubuntu-24.04-ppc64le' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build-status artifact
        uses: actions/download-artifact@v4
        with:
          name: build-status

      - name: Collect scan results from COS
        env:
          GHA_CURRENCY_SERVICE_ID_API_KEY: ${{ secrets.GHA_CURRENCY_SERVICE_ID_API_KEY }}
          PACKAGE_NAME: ${{ fromJson(inputs.package_json).package_name }}
          PACKAGE_VERSION: ${{ fromJson(inputs.package_json).package_version }}
        run: |
          chmod +x ./gha-script/v2-script/collect_scan_results.sh
          bash ./gha-script/v2-script/collect_scan_results.sh \
            "$PACKAGE_NAME" \
            "$PACKAGE_VERSION" \
            "$GITHUB_WORKSPACE/v2-scan-workspace" \
            "${{ github.run_id }}"

      - name: Download and extract license results from COS
        env:
          GHA_CURRENCY_SERVICE_ID_API_KEY: ${{ secrets.GHA_CURRENCY_SERVICE_ID_API_KEY }}
          GHA_RUN_ID: ${{ github.run_id }}
          PACKAGE_NAME: ${{ fromJson(inputs.package_json).package_name }}
          PACKAGE_VERSION: ${{ fromJson(inputs.package_json).package_version }}
        run: |
          chmod +x ./gha-script/v2-script/download_from_cos.sh
          bash ./gha-script/v2-script/download_from_cos.sh \
            "${PACKAGE_NAME}-${PACKAGE_VERSION}-v2-license-results.tar.gz" --optional
          if [ -f "${PACKAGE_NAME}-${PACKAGE_VERSION}-v2-license-results.tar.gz" ]; then
            tar -xzf "${PACKAGE_NAME}-${PACKAGE_VERSION}-v2-license-results.tar.gz"
          fi

      - name: Create and print final V2 scan summary
        env:
          PACKAGE_NAME: ${{ fromJson(inputs.package_json).package_name }}
          PACKAGE_VERSION: ${{ fromJson(inputs.package_json).package_version }}
        run: |
          # Load per-job build statuses written by v2_license_extraction
          set -a; source build-status.env; set +a
          python3 ./gha-script/v2-script/create_scan_summary.py \
            "$GITHUB_WORKSPACE/v2-scan-workspace" \
            "$PACKAGE_NAME" \
            "$PACKAGE_VERSION" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Archive and upload final V2 summary to COS
        env:
          GHA_CURRENCY_SERVICE_ID_API_KEY: ${{ secrets.GHA_CURRENCY_SERVICE_ID_API_KEY }}
          GHA_RUN_ID: ${{ github.run_id }}
          PACKAGE_NAME: ${{ fromJson(inputs.package_json).package_name }}
          PACKAGE_VERSION: ${{ fromJson(inputs.package_json).package_version }}
        run: |
          ARTIFACT_NAME="${PACKAGE_NAME}-${PACKAGE_VERSION}-v2-final-summary"
          tar -czf "${ARTIFACT_NAME}.tar.gz" v2-scan-workspace/final_summary.json
          chmod +x ./gha-script/v2-script/upload_to_cos.sh
          bash ./gha-script/v2-script/upload_to_cos.sh "${ARTIFACT_NAME}.tar.gz"

      - name: Delete build-status artifact
        if: always()
        uses: geekyeggo/delete-artifact@v5
        with:
          name: build-status

