# Minimum requirements for the build system to execute.
# Do not include sys,subprocess and os as they are default packages
[build-system]
requires = [
    "setuptools",
    "wheel",
]

#Set build backend to setuptools
build-backend = "setuptools.build_meta"

#Project name and version
[project]
name = "snappy"
version = "{PACKAGE_VERSION}"
license = {text = "BSD-3-Clause"}

#One line description
description = "A fast compressor/decompressor"

#Classifiers to improve package discoverability
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: C++",
  "License :: OSI Approved :: BSD License",
]

#Project URLs
[project.urls]
homepage = "https://github.com/google/snappy"
upstream = "https://github.com/google/snappy"

#Find package files in local folder — not following standard setuptools directory structure
[tool.setuptools.packages.find]
namespaces = true
where = ["local"]

#Package data to include all installed libraries, shared files, and headers in the wheel.
#These files are not Python and would be excluded by setuptools unless listed here.
[tool.setuptools.package-data]
snappy = ["lib/**/*", "share/**/*", "include/**/*"]

[tool.distutils.bdist_wheel]
plat-name = "linux_ppc64le"  # Explicitly set the platform tag
universal = false             # Disable universal wheel (forces platform-specific build)
