[build-system]
requires = [
    "setuptools",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "azure-storage-blobs-cpp"
version = "{PACKAGE_VERSION}"
description = "Azure Storage Blobs SDK for C++ packaging (ppc64le)"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: C++",
  "License :: OSI Approved :: MIT License",
]

[project.urls]
homepage = "https://github.com/Azure/azure-sdk-for-cpp"
upstream = "https://github.com/Azure/azure-sdk-for-cpp"

# Explicitly list only our package — prevents setuptools flat-layout
# discovery from scanning the whole repo root (eng/, sdk/, samples/, etc.)
[tool.setuptools]
packages = ["azure_storage_blobs_cpp"]
package-dir = {"" = "local"}

# Package data: shared libs, headers, cmake config
[tool.setuptools.package-data]
"azure_storage_blobs_cpp" = [
    "lib64/libazure-storage-blobs*",
    "include/azure/storage/blobs.hpp",
    "include/azure/storage/blobs/**/*",
    "share/azure-storage-blobs-cpp/*",
]

[tool.distutils.bdist_wheel]
plat-name = "linux_ppc64le"
universal = false
